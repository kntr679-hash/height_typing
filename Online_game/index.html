<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タワー・タイピング対戦</title>

<style>
  .version-tag {
    position:absolute; top:10px; left:10px;
    font-size:14px; color:#72767d; font-family:monospace;
  }
  body {
    margin:0; padding:0; background:#23272a; color:#fff;
    font-family:Arial; display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:100vh;
  }
  .screen { display:none; text-align:center; width:100%; max-width:600px; }
  .active { display:block; }

  .title-img {
    max-width:90%; height:auto; margin-bottom:20px;
  }

  #roomPass {
    font-size:20px; padding:12px 20px; width:280px;
    border:3px solid #6c757d; border-radius:12px;
    background:#2f3136; color:#fff; text-align:center;
  }

  .img-button {
    cursor:pointer; transition:transform 0.2s;
    width:180px; height:180px; object-fit:cover; border-radius:50%;
  }
  .img-button:hover { transform:translateY(-6px) scale(1.04); }

  .word-display {
    font-size:32px; background:#2f3136; padding:12px 20px;
    border-radius:12px; margin-top:20px;
  }
  .typed-word { color:#555; }
</style>
</head>

<body>
<div class="version-tag">Ver.2.0 MantleDB</div>

<!-- ロビー画面 -->
<div id="lobbyScreen" class="screen active">
  <img src="title.jpg" class="title-img">
  <input id="roomPass" placeholder="合言葉を入力">
  <br><br>
  <img src="enter_room.jpg" class="img-button" onclick="joinOrCreateRoom()">
  <p id="status">合言葉を入れてボタンを押してね</p>
  <p id="alertBox" style="color:#ff8a65;"></p>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen" class="screen">
  <h2>タワー・タイピング対戦</h2>
  <div>
    あなたの高さ：<span id="myHeight">0</span> cm<br>
    あいての高さ：<span id="rivalHeight">0</span> cm
  </div>

  <div class="word-display">
    <span id="typedPart" class="typed-word"></span>
    <span id="untypedPart"></span>
  </div>
</div>

<script>
// ---- MantleDB 基本 ----
const DB_NAME = "towergame"; // 好きな名前でOK

async function loadRoom(roomPass) {
  const url = `https://mantledb.sh/${DB_NAME}/room_${encodeURIComponent(roomPass)}`;
  const res = await fetch(url);
  if (!res.ok) return null;
  try { return await res.json(); }
  catch { return null; }
}

async function saveRoom(roomPass, roomData) {
  const url = `https://mantledb.sh/${DB_NAME}/room_${encodeURIComponent(roomPass)}`;
  await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(roomData)
  });
}

// ---- ゲーム状態 ----
let myRole = "";
let roomPass = "";
let currentWord = "";
let typedIndex = 0;
let myHeight = 0;
let rivalHeight = 0;
let pollTimer = null;

const words = ["tower","battle","typing","rocket","castle","future","coding","keyboard"];

// ---- ロビー処理 ----
async function joinOrCreateRoom() {
  const pass = document.getElementById("roomPass").value.trim();
  const status = document.getElementById("status");
  const alertBox = document.getElementById("alertBox");

  if (!pass) {
    alertBox.textContent = "合言葉を入力してね";
    return;
  }
  alertBox.textContent = "";
  status.textContent = "部屋情報を読み込み中...";

  roomPass = pass;
  let room = await loadRoom(roomPass);

  if (!room) {
    // 新規部屋作成（p1）
    myRole = "p1";
    currentWord = pickWord();
    room = {
      p1_connected:true,
      p2_connected:false,
      p1_height:0,
      p2_height:0,
      current_word:currentWord,
      status:"waiting"
    };
    await saveRoom(roomPass, room);
    status.textContent = "部屋ができました！相手の参加を待っています...";
    waitForOpponent();
  } else {
    // 既存部屋に参加（p2）
    if (room.p2_connected) {
      alertBox.textContent = "この部屋は満員です！";
      status.textContent = "入れませんでした。";
      return;
    }
    myRole = "p2";
    room.p2_connected = true;
    room.status = "playing";
    await saveRoom(roomPass, room);
    status.textContent = "部屋に入れました！ゲームを開始します。";
    startGame(room);
  }
}

function pickWord() {
  return words[Math.floor(Math.random()*words.length)];
}

// ---- p1側：相手待ち ----
function waitForOpponent() {
  const status = document.getElementById("status");
  pollTimer = setInterval(async () => {
    let room = await loadRoom(roomPass);
    if (!room) return;
    if (room.p2_connected) {
      clearInterval(pollTimer);
      status.textContent = "対戦相手が来ました！ゲームを開始します。";
      startGame(room);
    }
  }, 1500);
}

// ---- ゲーム開始 ----
function startGame(room) {
  document.getElementById("lobbyScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");

  if (myRole === "p1") {
    myHeight = room.p1_height;
    rivalHeight = room.p2_height;
  } else {
    myHeight = room.p2_height;
    rivalHeight = room.p1_height;
  }
  currentWord = room.current_word || pickWord();
  typedIndex = 0;
  renderWord();
  updateHeights();

  window.addEventListener("keydown", onKey);

  pollTimer = setInterval(syncFromServer, 1000);
}

function renderWord() {
  document.getElementById("typedPart").textContent = currentWord.slice(0, typedIndex);
  document.getElementById("untypedPart").textContent = currentWord.slice(typedIndex);
}

function updateHeights() {
  document.getElementById("myHeight").textContent = myHeight;
  document.getElementById("rivalHeight").textContent = rivalHeight;
}

// ---- キー入力 ----
function onKey(e) {
  if (!/^[a-zA-Z]$/.test(e.key)) return;
  const expected = currentWord[typedIndex];
  if (!expected) return;

  if (e.key.toLowerCase() === expected.toLowerCase()) {
    typedIndex++;
    renderWord();
    if (typedIndex >= currentWord.length) {
      onWordCompleted();
    }
  }
}

async function onWordCompleted() {
  typedIndex = 0;
  currentWord = pickWord();
  myHeight += 10;
  updateHeights();

  let room = await loadRoom(roomPass) || {};
  if (myRole === "p1") {
    room.p1_height = myHeight;
  } else {
    room.p2_height = myHeight;
  }
  room.current_word = currentWord;
  await saveRoom(roomPass, room);
}

// ---- サーバーから同期 ----
async function syncFromServer() {
  let room = await loadRoom(roomPass);
  if (!room) return;

  if (myRole === "p1") {
    myHeight = room.p1_height;
    rivalHeight = room.p2_height;
  } else {
    myHeight = room.p2_height;
    rivalHeight = room.p1_height;
  }
  updateHeights();

  if (room.current_word && room.current_word !== currentWord) {
    currentWord = room.current_word;
    typedIndex = 0;
    renderWord();
  }
}
</script>
</body>
</html>
