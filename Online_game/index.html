<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タワー・タイピング対戦（通信版）</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #23272a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-img {
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
        }

        .input-container {
            margin-bottom: 10px;
        }

        #roomPass {
            font-size: 20px;
            padding: 12px 20px;
            width: 280px;
            border: 3px solid #6c757d;
            border-radius: 12px;
            background-color: #2f3136;
            color: #fff;
            text-align: center;
            outline: none;
        }

        .alert-message {
            color: #ff8a65;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 24px;
        }

        .button-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .img-button {
            cursor: pointer;
            transition: transform 0.2s;
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        .img-button:hover {
            transform: translateY(-6px) scale(1.04);
        }

        #status {
            margin-top: 45px;
            font-size: 20px;
            font-weight: bold;
            color: #e9ecef;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }

        /* 🎮 ゲーム画面のデザイン */
        .vs-container {
            display: flex;
            gap: 50px;
            margin-bottom: 20px;
            justify-content: center;
            width: 100%;
        }

        .player-box {
            background: #2f3136;
            padding: 15px;
            border-radius: 12px;
            min-width: 150px;
        }

        .my-box {
            border: 3px solid #a3e635;
        }

        .rival-box {
            border: 3px solid #ff8a65;
        }

        .height-val {
            font-size: 36px;
            font-weight: bold;
            color: #ffd8b3;
        }

        .floor-status {
            font-size: 16px;
            color: #aaa;
        }

        .word-display {
            font-size: 36px;
            background: #2f3136;
            padding: 20px;
            border-radius: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .typed-word {
            color: #555;
        }
    </style>
</head>

<body>

    <!-- ================= 1. ロビー画面 ================= -->
    <div id="lobbyScreen" class="screen active">
        <img src="title.jpg" alt="友人とタイピングゲーム!!!" class="title-img">
        <div class="input-container">
            <input type="text" id="roomPass" placeholder="合言葉をにゅうりょく">
        </div>
        <div id="alertBox" class="alert-message"></div>
        <div class="button-container">
            <img src="create_room.jpg" alt="部屋を作る" class="img-button" onclick="createRoom()">
            <img src="enter_room.jpg" alt="部屋に入る" class="img-button" onclick="joinRoom()">
        </div>
        <p id="status">合言葉を入れて、ボタンを押してね</p>
    </div>

    <!-- ================= 2. ゲーム画面 ================= -->
    <div id="gameScreen" class="screen">
        <div class="vs-container">
            <!-- じぶんの高さ -->
            <div class="player-box my-box">
                <div>あなた</div>
                <div class="height-val" id="myHeight">0 cm</div>
                <div class="floor-status" id="myFloor">地上 0階</div>
            </div>
            <!-- あいての高さ -->
            <div class="player-box rival-box">
                <div>あいて</div>
                <div class="height-val" id="rivalHeight">0 cm</div>
                <div class="floor-status" id="rivalFloor">地上 0階</div>
            </div>
        </div>

        <div class="word-display" id="wordBox">loading...</div>
        <p>キーボードで文字をうってね！</p>
    </div>
    <script>
        // 誰でも無料で制限なく使えるKVdbというデータサーバーのURLです
        const dbUrl = "https://kvdb.io";

        const wordList = ["apple", "banana", "cherry", "grape", "orange", "lemon", "melon", "peach"];
        let currentWord = "";
        let typedIndex = 0;

        let myRole = "";       // "p1"（作った人） または "p2"（入った人）
        let myHeightNum = 0;
        let rivalHeightNum = 0;
        let roomKey = "";      // 通信に使う部屋の名前
        let loopInterval = null;

        // 1. 部屋を作る（プレイヤー1になる）
        async function createRoom() {
            const pass = document.getElementById("roomPass").value;
            if (!pass) { document.getElementById("alertBox").innerText = "⚠ 合言葉を入れてね！"; return; }
            roomKey = encodeURIComponent(pass);
            myRole = "p1";

            document.getElementById("status").innerText = "部屋を作って相手を待っています...";

            const startData = { p1: 0, p2: 0, status: "waiting" };
            await fetch(dbUrl + roomKey, {
                method: "POST",
                body: JSON.stringify(startData)
            });

            loopInterval = setInterval(checkRivalJoin, 1000);
        }

        // プレイヤー1専用：プレイヤー2が来たか見張る
        async function checkRivalJoin() {
            try {
                const res = await fetch(dbUrl + roomKey);
                if (!res.ok) return;
                const data = await res.json();

                if (data.status === "playing") {
                    clearInterval(loopInterval);
                    startGame();
                }
            } catch (e) { console.log(e); }
        }

        // 2. 部屋に入る（プレイヤー2になる）
        async function joinRoom() {
            const pass = document.getElementById("roomPass").value;
            if (!pass) { document.getElementById("alertBox").innerText = "⚠ 合言葉を入れてね！"; return; }
            roomKey = encodeURIComponent(pass);
            myRole = "p2";

            document.getElementById("status").innerText = "部屋を探して入っています...";

            try {
                const res = await fetch(dbUrl + roomKey);
                if (!res.ok) { document.getElementById("status").innerText = "その部屋は見つかりませんでした。"; return; }
                const data = await res.json();

                if (data.status === "waiting") {
                    data.status = "playing";
                    await fetch(dbUrl + roomKey, { method: "POST", body: JSON.stringify(data) });
                    startGame();
                } else {
                    document.getElementById("status").innerText = "その部屋は満員か、すでにゲームが終わっています。";
                }
            } catch (e) {
                document.getElementById("status").innerText = "通信エラーが発生しました。";
            }
        }

        // 🎮 本当のゲーム開始
        function startGame() {
            document.getElementById("lobbyScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
            nextWord();
            window.addEventListener("keydown", checkInput);

            loopInterval = setInterval(syncGameData, 500);
        }

        // ネットを通じてお互いの高さをデータ送信＆受信
        async function syncGameData() {
            try {
                const res = await fetch(dbUrl + roomKey);
                if (!res.ok) return;
                const data = await res.json();

                if (myRole === "p1") {
                    rivalHeightNum = data.p2;
                } else {
                    rivalHeightNum = data.p1;
                }
                updateDisplay(false);

                data[myRole] = myHeightNum;
                await fetch(dbUrl + roomKey, { method: "POST", body: JSON.stringify(data) });
            } catch (e) { console.log(e); }
        }

        function nextWord() {
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIndex = 0;
            updateWordDisplay();
        }

        function updateWordDisplay() {
            const wordBox = document.getElementById("wordBox");
            const typed = currentWord.substring(0, typedIndex);
            const untyped = currentWord.substring(typedIndex);
            wordBox.innerHTML = `<span class="typed-word">${typed}</span>${untyped}`;
        }

        function checkInput(e) {
            if (e.key.length !== 1) return;
            if (e.key === currentWord[typedIndex]) {
                typedIndex++;
                if (typedIndex >= currentWord.length) {
                    myHeightNum += 10; updateDisplay(true); nextWord();
                } else { updateWordDisplay(); }
            } else {
                myHeightNum -= 30; updateDisplay(true); typedIndex = 0; updateWordDisplay();
            }
        }

        function updateDisplay(isMyData) {
            if (isMyData) {
                document.getElementById("myHeight").innerText = myHeightNum + " cm";
                const myFloor = document.getElementById("myFloor");
                if (myHeightNum >= 0) {
                    myFloor.innerText = `地上 ${Math.floor(myHeightNum / 300)} 階`;
                    myFloor.style.color = "#a3e635";
                } else {
                    myFloor.innerText = `地下 ${Math.floor(Math.abs(myHeightNum) / 300) + 1} 階 🕳️`;
                    myFloor.style.color = "#f87171";
                }
            } else {
                document.getElementById("rivalHeight").innerText = rivalHeightNum + " cm";
                const rivalFloor = document.getElementById("rivalFloor");
                if (rivalHeightNum >= 0) {
                    rivalFloor.innerText = `地上 ${Math.floor(rivalHeightNum / 300)} 階`;
                    rivalFloor.style.color = "#a3e635";
                } else {
                    rivalFloor.innerText = `地下 ${Math.floor(Math.abs(rivalHeightNum) / 300) + 1} 階 🕳️`;
                    rivalFloor.style.color = "#f87171";
                }
            }
        }
    </script>
</body>

</html>
