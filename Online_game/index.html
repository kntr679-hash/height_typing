    <script>
        const wordList = ["apple", "banana", "cherry", "grape", "orange", "lemon", "melon", "peach"];
        let currentWord = "";
        let typedIndex = 0;
        
        let myRole = "";       
        let myHeightNum = 0;
        let rivalHeightNum = 0;
        let roomKey = "";      
        let loopInterval = null;

        // 1. 部屋を作る（プレイヤー1になる）
        async function createRoom() {
            const pass = document.getElementById("roomPass").value;
            if(!pass) { document.getElementById("alertBox").innerText = "⚠ 合言葉を入れてね！"; return; }
            
            roomKey = encodeURIComponent(pass);
            
            // ⭕ 大バグの変数合体を完全にやめて、1本に真っ直ぐ繋ぎました！
            const fullUrl = "https://kvdb.io" + roomKey;
            
            myRole = "p1";
            document.getElementById("status").innerText = "部屋を作って相手を待っています...";
            
            const startData = { p1: 0, p2: 0, status: "waiting" };
            await fetch(fullUrl, {
                method: "POST",
                body: JSON.stringify(startData)
            });

            if(loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(checkRivalJoin, 1000);
        }

        async function checkRivalJoin() {
            try {
                const fullUrl = "https://kvdb.io" + roomKey;
                const res = await fetch(fullUrl);
                if(!res.ok) return; 
                const data = await res.json();
                
                if(data.status === "playing") {
                    clearInterval(loopInterval); 
                    startGame();
                }
            } catch(e) { console.log(e); }
        }

        // 2. 部屋に入る（プレイヤー2になる）
        async function joinRoom() {
            const pass = document.getElementById("roomPass").value;
            if(!pass) { document.getElementById("alertBox").innerText = "⚠ 合言葉を入れてね！"; return; }
            
            roomKey = encodeURIComponent(pass);
            const fullUrl = "https://kvdb.io" + roomKey;
            myRole = "p2";

            document.getElementById("status").innerText = "部屋を探して入っています...";

            try {
                const res = await fetch(fullUrl);
                
                if(!res.ok) {
                    const startData = { p1: 0, p2: 0, status: "playing" };
                    await fetch(fullUrl, { method: "POST", body: JSON.stringify(startData) });
                    startGame();
                    return;
                }

                const data = await res.json();
                if(data.status === "waiting" || data.status === "playing") {
                    data.status = "playing";
                    await fetch(fullUrl, { method: "POST", body: JSON.stringify(data) });
                    startGame();
                } else {
                    document.getElementById("status").innerText = "その部屋は満員です。別の合言葉にしてください。";
                }
            } catch(e) {
                document.getElementById("status").innerText = "通信エラーが発生しました。";
            }
        }

        function startGame() {
            document.getElementById("lobbyScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
            nextWord();
            window.addEventListener("keydown", checkInput);
            
            if(loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(syncGameData, 500);
        }

        async function syncGameData() {
            try {
                const fullUrl = "https://kvdb.io" + roomKey;
                const res = await fetch(fullUrl);
                if(!res.ok) return;
                const data = await res.json();

                if(myRole === "p1") {
                    rivalHeightNum = data.p2 || 0;
                } else {
                    rivalHeightNum = data.p1 || 0;
                }
                updateDisplay(false); 

                data[myRole] = myHeightNum;
                await fetch(fullUrl, { method: "POST", body: JSON.stringify(data) });
            } catch(e) { console.log(e); }
        }

        function nextWord() {
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIndex = 0;
            updateWordDisplay();
        }

        function updateWordDisplay() {
            const wordBox = document.getElementById("wordBox");
            const typed = currentWord.substring(0, typedIndex);
            const untyped = currentWord.substring(typedIndex);
            wordBox.innerHTML = `<span class="typed-word">${typed}</span>${untyped}`;
        }

        function checkInput(e) {
            if (e.key.length !== 1) return;
            if (e.key === currentWord[typedIndex]) {
                typedIndex++;
                if (typedIndex >= currentWord.length) {
                    myHeightNum += 10; updateDisplay(true); nextWord();
                } else { updateWordDisplay(); }
            } else {
                myHeightNum -= 30; updateDisplay(true); typedIndex = 0; updateWordDisplay();
            }
        }

        function updateDisplay(isMyData) {
            if(isMyData) {
                document.getElementById("myHeight").innerText = myHeightNum + " cm";
                const myFloor = document.getElementById("myFloor");
                if (myHeightNum >= 0) {
                    myFloor.innerText = `地上 ${Math.floor(myHeightNum / 300)} 階`;
                    myFloor.style.color = "#a3e635";
                } else {
                    myFloor.innerText = `地下 ${Math.floor(Math.abs(myHeightNum) / 300) + 1} 階 🕳️`;
                    myFloor.style.color = "#f87171";
                }
            } else {
                document.getElementById("rivalHeight").innerText = rivalHeightNum + " cm";
                const rivalFloor = document.getElementById("rivalFloor");
                if (rivalHeightNum >= 0) {
                    rivalFloor.innerText = `地上 ${Math.floor(rivalHeightNum / 300)} 階`;
                    rivalFloor.style.color = "#a3e635";
                } else {
                    rivalFloor.innerText = `地下 ${Math.floor(Math.abs(rivalHeightNum) / 300) + 1} 階 🕳️`;
                    rivalFloor.style.color = "#f87171";
                }
            }
        }
    </script>
</body>
</html>
