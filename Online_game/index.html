<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タワー・タイピング対戦</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #23272a; color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        .screen { display: none; text-align: center; width: 100%; max-width: 600px; }
        .active { display: flex; flex-direction: column; align-items: center; }
        .title-img { max-width: 90%; height: auto; margin-bottom: 20px; }
        .input-container { margin-bottom: 10px; }
        #roomPass {
            font-size: 20px; padding: 12px 20px; width: 280px;
            border: 3px solid #6c757d; border-radius: 12px;
            background-color: #2f3136; color: #fff; text-align: center; outline: none;
        }
        .alert-message { color: #ff8a65; font-size: 18px; font-weight: bold; margin-bottom: 20px; min-height: 24px; }
        .button-container { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
        .img-button { cursor: pointer; transition: transform 0.2s; width: 180px; height: 180px; object-fit: cover; border-radius: 50%; }
        .img-button:hover { transform: translateY(-6px) scale(1.04); }
        
        #status { margin-top: 45px; font-size: 20px; font-weight: bold; color: #e9ecef; padding: 10px 20px; background-color: rgba(0,0,0,0.2); border-radius: 20px; }
        
        /* 🎮 ゲーム画面のデザイン */
        .vs-container { display: flex; gap: 50px; margin-bottom: 20px; justify-content: center; width: 100%; }
        .player-box { background: #2f3136; padding: 15px; border-radius: 12px; min-width: 150px; }
        .my-box { border: 3px solid #a3e635; }
        .rival-box { border: 3px solid #ff8a65; }
        .height-val { font-size: 36px; font-weight: bold; color: #ffd8b3; }
        .floor-status { font-size: 16px; color: #aaa; }
        .word-display { font-size: 36px; background: #2f3136; padding: 20px; border-radius: 12px; letter-spacing: 2px; margin-bottom: 20px; }
        .typed-word { color: #555; }
    </style>
</head>
<body>

    <!-- ================= 1. ロビー画面 ================= -->
    <div id="lobbyScreen" class="screen active">
        <img src="title.jpg" alt="友人とタイピングゲーム!!!" class="title-img">
        <div class="input-container">
            <input type="text" id="roomPass" placeholder="合言葉をにゅうりょく">
        </div>
        <div id="alertBox" class="alert-message"></div>
        <div class="button-container">
            <img src="create_room.jpg" alt="部屋を作る" class="img-button" onclick="createRoom()">
            <img src="enter_room.jpg" alt="部屋に入る" class="img-button" onclick="joinRoom()">
        </div>
        <p id="status">合言葉を入れて、ボタンを押してね</p>
    </div>

    <!-- ================= 2. ゲーム画面 ================= -->
    <div id="gameScreen" class="screen">
        <div class="vs-container">
            <div class="player-box my-box">
                <div>あなた</div>
                <div class="height-val" id="myHeight">0 cm</div>
                <div class="floor-status" id="myFloor">地上 0階</div>
            </div>
            <div class="player-box rival-box">
                <div>あいて</div>
                <div class="height-val" id="rivalHeight">0 cm</div>
                <div class="floor-status" id="rivalFloor">地上 0階</div>
            </div>
        </div>
        
        <div class="word-display" id="wordBox">loading...</div>
        <p>キーボードで文字をうってね！</p>
    </div>
    <script>
 // 1. あなたのバケットID（金庫のID）をここにセットしてください
const bucketId = "ここにあなたのバケットIDを入れる"; 

// 2. 基本となるURL（最後にスラッシュを入れておきます）
const dbUrl = `https://kvdb.io{bucketId}`; 

// ================= 部屋を作る関数 =================
async function createRoom() {
    const roomPass = document.getElementById("roomPass").value.trim();
    const alertBox = document.getElementById("alertBox");
    const statusText = document.getElementById("status");

    // 合言葉（パスワード）が空っぽなら警告して止める
    if (!roomPass) {
        alertBox.textContent = "合言葉を入力してください！";
        return;
    }
    alertBox.textContent = ""; // 警告をクリア
    statusText.textContent = "部屋を作成中...";

    try {
        // 💡 エラーの原因だったURLの組み立てを修正！
        // https://kvdb.io というURLになります
        const response = await fetch(`${dbUrl}/${roomPass}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            // ルームの初期データ（プレイヤー1が参加、お互いの高さは0）
            body: JSON.stringify({
                p1_connected: true,
                p2_connected: false,
                p1_height: 0,
                p2_height: 0,
                status: "waiting"
            })
        });

        if (!response.ok) {
            throw new Error("サーバーの応答が良くないみたいです");
        }

        const data = await response.json();
        
        // 自分が「先攻（player1）」であることを保存
        myRole = "p1"; 
        
        statusText.textContent = "部屋ができました！相手の参加を待っています...";
        
        // 画面をゲーム画面に切り替える処理や、相手を待つループ処理をここに続ける
        // switchScreen("gameScreen"); など

    } catch (error) {
        console.error(error);
        alertBox.textContent = "エラーが発生しました。接続を確認してください。";
        statusText.textContent = "作成に失敗しました。";
    }
}

    </script>
</body>
</html>
